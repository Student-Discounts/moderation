spring:
  datasource:
    url: ${SD_MODERATION_DB_URL:jdbc:postgresql://localhost:5434/moderation}
    username: ${SD_MODERATION_DB_USER:moderation}
    password: ${SD_MODERATION_DB_PASSWORD:moderation}
  kafka.bootstrap-servers: ${SD_MODERATION_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security.oauth2.resourceserver.jwt:
    issuer-uri: ${SD_MODERATION_AUTH_ISSUER:http://localhost:8080}
    jwk-set-uri: ${SD_MODERATION_AUTH_JWK_SET_URI:http://localhost:8080/.well-known/jwks.json}
moderation.local-topics-enabled: true
