name: moderation-media
services:
  moderation-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: moderation
      POSTGRES_USER: moderation
      POSTGRES_PASSWORD: ${SD_MODERATION_DB_PASSWORD:-moderation}
    ports: ['127.0.0.1:5434:5432']
    volumes: ['moderation-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moderation -d moderation']
      interval: 3s
      timeout: 3s
      retries: 30
  media-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: media
      POSTGRES_USER: media
      POSTGRES_PASSWORD: ${SD_MEDIA_DB_PASSWORD:-media}
    ports: ['127.0.0.1:5435:5432']
    volumes: ['media-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U media -d media']
      interval: 3s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:4.1.0
    environment:
      CLUSTER_ID: bW9kZXJhdGlvbi1tZWRpYQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ['127.0.0.1:9092:9092']
    volumes: ['kafka:/var/lib/kafka/data']
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1']
      interval: 5s
      timeout: 8s
      retries: 30
      start_period: 20s
  s3:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${SD_MEDIA_S3_ACCESS_KEY:-minio-local}
      MINIO_ROOT_PASSWORD: ${SD_MEDIA_S3_SECRET_KEY:-minio-local-secret-change-me}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['media-objects:/data']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 3s
      timeout: 3s
      retries: 30
  moderation:
    profiles: ['apps']
    build:
      context: .
      args: { SERVICE: moderation-service }
    environment:
      SPRING_PROFILES_ACTIVE: local
      SD_MODERATION_DB_URL: jdbc:postgresql://moderation-db:5432/moderation
      SD_MODERATION_DB_USER: moderation
      SD_MODERATION_DB_PASSWORD: ${SD_MODERATION_DB_PASSWORD:-moderation}
      SD_MODERATION_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SD_MODERATION_AUTH_ISSUER: ${SD_AUTH_ISSUER:-http://localhost:8080}
      SD_MODERATION_AUTH_JWK_SET_URI: ${SD_AUTH_JWK_SET_URI:-http://host.docker.internal:8080/.well-known/jwks.json}
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:8082:8082']
    depends_on:
      moderation-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
  media:
    profiles: ['apps']
    build:
      context: .
      args: { SERVICE: media-service }
    environment:
      SPRING_PROFILES_ACTIVE: local
      SD_MEDIA_DB_URL: jdbc:postgresql://media-db:5432/media
      SD_MEDIA_DB_USER: media
      SD_MEDIA_DB_PASSWORD: ${SD_MEDIA_DB_PASSWORD:-media}
      SD_MEDIA_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SD_MEDIA_AUTH_ISSUER: ${SD_AUTH_ISSUER:-http://localhost:8080}
      SD_MEDIA_AUTH_JWK_SET_URI: ${SD_AUTH_JWK_SET_URI:-http://host.docker.internal:8080/.well-known/jwks.json}
      SD_MEDIA_SERVICE_TOKEN: ${SD_MEDIA_SERVICE_TOKEN:-local-media-service-token-change-me}
      SD_MEDIA_S3_ENDPOINT: http://s3:9000
      SD_MEDIA_S3_REGION: us-east-1
      SD_MEDIA_S3_BUCKET: media-private
      SD_MEDIA_S3_ACCESS_KEY: ${SD_MEDIA_S3_ACCESS_KEY:-minio-local}
      SD_MEDIA_S3_SECRET_KEY: ${SD_MEDIA_S3_SECRET_KEY:-minio-local-secret-change-me}
      SD_MEDIA_S3_CREATE_BUCKET: 'true'
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:8083:8083']
    depends_on:
      media-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
      s3: { condition: service_healthy }
volumes:
  moderation-db:
  media-db:
  kafka:
  media-objects:
